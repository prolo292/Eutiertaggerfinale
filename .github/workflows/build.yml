name: Build Universal TierTagger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
          unzip -q gradle-9.2.1-bin.zip

      - name: Build mod
        run: ./gradle-9.2.1/bin/gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTierTagger
          path: build/libs/*.jar
